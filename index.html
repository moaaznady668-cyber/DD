<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم ESP32 عبر HiveMQ</title>
    <!-- استدعاء مكتبة MQTT.js عبر CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            padding: 15px 35px;
            font-size: 18px;
            margin: 15px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-on { background-color: #28a745; }
        .btn-on:hover { background-color: #218838; }
        .btn-off { background-color: #dc3545; }
        .btn-off:hover { background-color: #c82333; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>لوحة تحكم ESP32 LED</h2>
        <p id="status">جاري الاتصال بالوسيط...</p>
        <br>
        <button class="btn-on" onclick="publishMessage('ON')">تشغيل الليد (ON)</button>
        <button class="btn-off" onclick="publishMessage('OFF')">إطفاء الليد (OFF)</button>
    </div>

    <script>
        // الاتصال بـ HiveMQ عبر WebSocket الآمن (WSS)
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topic = 'esp32/led/control';

        const client = mqtt.connect(brokerUrl, {
            clientId: 'WebClient_' + Math.random().toString(16).substring(2, 8)
        });

        client.on('connect', () => {
            document.getElementById('status').innerText = 'متصل بنجاح بالشبكة (Connected)';
            document.getElementById('status').style.color = 'green';
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = 'فشل الاتصال: ' + err;
            document.getElementById('status').style.color = 'red';
            client.end();
        });

        function publishMessage(message) {
            client.publish(topic, message, (err) => {
                if (err) {
                    console.error('خطأ في إرسال الأمر: ', err);
                }
            });
        }
    </script>

</body>
</html>
